services:
  - type: web
    name: app-entrenamiento
    runtime: node
    plan: starter            # el disco persistente requiere un plan de pago
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ACCESS_TOKEN
        generateValue: true  # tu enlace será https://<tu-app>.onrender.com/t/<ACCESS_TOKEN>
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
